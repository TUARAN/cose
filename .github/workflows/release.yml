name: Release

# 触发：push tag `v*`（如 v1.3.6）→ build → zip → 创建 GitHub Release
# 工作流要求 tag 名（去掉前导 v）与 apps/extension/package.json 的 version 字段一致，
# 否则提前 fail —— 避免发布出去的 zip 内 manifest.version 与 release tag 对不上。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '手动触发时的 tag 名（例如 v1.3.6），仅用于本地调试'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create 需要写 release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No tag resolved"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG · Version: $VERSION"

      - name: Verify version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./apps/extension/package.json').version")
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          echo "package.json version: $PKG_VERSION"
          echo "tag version:          $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION 与 apps/extension/package.json version $PKG_VERSION 不一致"
            echo "::error::请先在 apps/extension/package.json 把 version 改成 $TAG_VERSION 再打 tag"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (chromium, release)
        run: pnpm -C apps/extension build:release

      - name: Build (firefox)
        run: pnpm -C apps/extension build:firefox -- --release
        continue-on-error: true # Firefox 失败不阻塞 Chrome 发布

      - name: Package zip
        id: package
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          ZIP_NAME="syncblog-publisher-v${VERSION}.zip"
          cd apps/extension/dist
          zip -r "../../../$ZIP_NAME" . -x "*.DS_Store"
          cd -
          ls -lh "$ZIP_NAME"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_path=$(pwd)/$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          ZIP="${{ steps.package.outputs.zip_name }}"

          # 如果 release 已存在（手动触发情形），先覆盖上传产物
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, uploading asset with --clobber"
            gh release upload "$TAG" "$ZIP" --clobber
          else
            {
              printf 'Syncblog 同步助手 %s\n\n' "$TAG"
              printf '## 安装\n\n'
              printf '下载 `%s`，解压后在 Chrome 打开 `chrome://extensions`，开启「开发者模式」→「加载已解压的扩展程序」，选择解压得到的文件夹。\n\n' "$ZIP"
              printf '## 平台覆盖\n\n'
              printf '支持知乎 / 公众号 / 微博 / 思否 / 掘金 / CSDN / 博客园 / 简书 / InfoQ / 少数派 / 51CTO / 头条 / 百家号 / 网易号 / 搜狐 / 豆瓣 / 哔哩哔哩 / 抖音 / 小红书 / X / Medium / WordPress / 腾讯云 / 阿里云 / 华为云 / 华为开发者 / 火山引擎 / 百度千帆 / 魔搭社区 / 电子发烧友 / 支付宝开放平台 等。\n\n'
              printf '## 配套站点\n\n'
              printf '[syncblog.cn](https://syncblog.cn)\n'
            } > release-notes.md

            gh release create "$TAG" "$ZIP" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
