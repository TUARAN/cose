<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 340px;
      padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f3ed;
      color: #22231e;
    }
    .container {
      text-align: left;
    }
    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 21px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    p {
      font-size: 13px;
      line-height: 1.6;
      color: #67695d;
      margin-bottom: 16px;
    }
    p a {
      color: #7f8863;
      text-decoration: none;
    }
    p a:hover {
      text-decoration: underline;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background: #20211c;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
      border: 1px solid #20211c;
      cursor: pointer;
    }
    .btn:hover {
      background: #2b2a23;
    }
    .divider {
      margin: 16px 0;
      border-top: 1px solid #e5e5e5;
    }
    .hint {
      font-size: 12px;
      color: #7b7d72;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>2aran 文章分发助手</h1>
    <p>扩展已启用，平台登录态只保留在浏览器中。</p>
    <p>从站内选择公开文章，把标题、正文、链接和图片写入多个平台草稿。</p>
    <div class="divider"></div>
    <p class="hint">首期：X Articles、掘金、小红书、CSDN、知乎、今日头条</p>
    <a href="https://2aran.com/admin/article-distribution" target="_blank" class="btn" id="openDistribution">打开文章分发台</a>
  </div>
  <script src="bundles/popup.js" type="module"></script>
</body>
</html>
